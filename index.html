<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой гардероб</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Гардероб">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Tenor+Sans&display=swap">
<style>
/* Личная система, светлая тема. Раскладка: шапка → слева фильтры, справа сетка карточек как в магазине → карточка вещи во всплывающем окне. */
:root {
  color-scheme: light;
  --bg: #ffffff; --surface: #fbfaf8; --line: #e8e6e6; --line-strong: #d3cfcf;
  --ink: #211c1c; --ink-muted: #6b6b6b; --accent: #e0679a; --pink: #ffe5eb; --pink-block: #fff2f5;
  --sky: #d9f5ff; --lemon: #fef7c9; --photo: #f4f3f1;
  --font-display: "Tenor Sans", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius-sm: 4px; --radius-md: 6px;
  --shadow-soft: 0 10px 30px #211c1c14, 0 1px 2px #211c1c0d;
  --focus-ring: 0 0 0 2px #ffffff, 0 0 0 4px #211c1c;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 22px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.page { padding: 32px; display: grid; gap: 24px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; }
.title { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 40px; margin: 0; }
.wave { display: block; width: 190px; height: 8px; margin-top: 2px; }
.wave path { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.cap { font-size: 12.5px; line-height: 16px; color: var(--ink-muted); }
.search { width: 320px; max-width: 100%; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; }
.side { position: sticky; top: 16px; display: grid; gap: 20px; align-content: start; max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; scrollbar-width: thin; }
.fgroup { display: grid; gap: 6px; }
.fgroup h3 { margin: 0; font-size: 12.5px; font-weight: 400; color: var(--ink-muted); text-transform: none; }
.tree { display: grid; gap: 1px; }
.trow { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; }
.tw { width: 22px; height: 28px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--ink-muted); border-radius: var(--radius-sm); cursor: pointer; }
.tw:hover { color: var(--ink); background: var(--surface); }
.tw svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
.tw[aria-expanded="true"] svg { transform: rotate(90deg); }
.lbl { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 28px; text-align: left; padding: 4px 8px; border: 0; border-radius: var(--radius-sm); background: none; cursor: pointer; font: inherit; font-size: 14px; color: inherit; }
.lbl:hover { background: var(--surface); }
.lbl[aria-pressed="true"] { background: var(--pink); }
.lbl.sub { font-size: 13.5px; }
.lbl.kind { font-size: 13px; }
.tree .n, .chip .n { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.kids { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
.kids.open { grid-template-rows: 1fr; }
.kids > div { overflow: hidden; }
.kids-in { margin: 1px 0 4px 10px; padding-left: 8px; border-left: 1px solid var(--line); display: grid; gap: 1px; }
@media (prefers-reduced-motion: reduce) { .kids, .tw svg { transition: none; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 4px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font-size: 12.5px; line-height: 20px; }
.chip .sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #0000001a; }
.chip[aria-pressed="true"] { border-color: var(--ink); }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.clr { display: inline-grid; place-items: center; width: 24px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-sm); background: none; color: var(--ink-muted); cursor: pointer; }
.clr:hover { color: var(--accent); background: var(--pink-block); }
.clr svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.clr.off { visibility: hidden; }
.reset:disabled { color: var(--ink-muted); border-color: var(--line); cursor: default; }
.reset { justify-self: start; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font-size: 13px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px 16px; }
.card { display: grid; gap: 8px; align-content: start; cursor: pointer; border: 0; padding: 0; background: none; text-align: left; }
.ph { position: relative; aspect-ratio: 3 / 4; border-radius: var(--radius-md); overflow: hidden; background: var(--photo); display: grid; place-items: center; }
.ph img { width: 100%; height: 100%; display: block; }
.ph img.own { object-fit: contain; padding: 8%; }
.ph img.store { object-fit: cover; }
.ph img.studio { object-fit: contain; background: #fff; }
.ph .ph-empty { display: grid; place-items: center; gap: 8px; color: var(--ink-muted); font-size: 12.5px; text-align: center; padding: 12px; }
.ph .dot { width: 48px; height: 48px; border-radius: 50%; border: 1px solid #0000001a; }
.badges { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 11.5px; line-height: 18px; padding: 0 6px; border-radius: var(--radius-sm); background: #ffffffe6; }
.badge.transit { background: var(--lemon); }
.card:hover .ph { box-shadow: inset 0 0 0 1px var(--line-strong); }
.cname { font-size: 14px; line-height: 19px; }
.cmeta { font-size: 12.5px; line-height: 16px; color: var(--ink-muted); }
.cno { font-weight: 600; color: var(--ink); }
.empty { padding: 48px 0; color: var(--ink-muted); text-align: center; }
dialog { border: 0; border-radius: var(--radius-md); padding: 0; max-width: min(880px, 94vw); width: 100%; box-shadow: var(--shadow-soft); }
dialog::backdrop { background: #211c1c66; }
.dlg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 700px) { .dlg { grid-template-columns: minmax(0, 1fr); } }
.dlg .ph { aspect-ratio: auto; min-height: 420px; border-radius: 0; }
.dlg-body { padding: 24px; display: grid; gap: 14px; align-content: start; }
.dlg-body h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 28px; margin: 0; }
.props { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; font-size: 14px; margin: 0; }
.props dt { color: var(--ink-muted); }
.props dd { margin: 0; }
.notes { font-size: 14px; line-height: 20px; background: var(--surface); border-radius: var(--radius-md); padding: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); text-decoration: none; color: var(--ink); font-size: 14px; }
.ms summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); font-size: 14px; }
.ms summary::-webkit-details-marker { display: none; }
.ms summary::after { content: '▾'; color: var(--ink-muted); }
.ms[open] summary::after { content: '▴'; }
.ms summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-body { display: grid; gap: 6px; margin-top: 6px; }
.ms-body .search { width: 100%; font-size: 13px; padding: 6px 8px; }
.ms-act { display: flex; gap: 6px; }
.ms-act button { padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font-size: 12.5px; }
.ms-list { max-height: 260px; overflow: auto; display: grid; gap: 1px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 4px; }
.ms-list label { display: flex; gap: 8px; align-items: center; padding: 3px 6px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; }
.ms-list label:hover { background: var(--surface); }
.ms-list label[hidden] { display: none; }
.ms-list input { accent-color: var(--accent); margin: 0; }
.ms-list .n { margin-left: auto; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.ms-list .zero { color: var(--ink-muted); }
.close { position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; }
.ftoggle { display: none; }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; } .page { padding: 16px; gap: 16px; }
  .side { position: static; display: none; max-height: none; overflow: visible; padding-right: 0; } body.fopen .side { display: grid; }
  .ftoggle { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font-size: 14px; }
  body.fopen .ftoggle { background: var(--pink); border-color: var(--pink); }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
  .search#q { width: 100%; }
}

/* ---------- В поездку (только веб) ---------- */
.tripopen { padding: 8px 14px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--bg); color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
.trip { display: grid; gap: 14px; }
.tbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; box-shadow: 0 6px 14px rgba(33,28,28,.06); }
.tbar .who { display: grid; gap: 2px; }
.tbar .t { font-family: var(--font-display); font-size: 20px; line-height: 24px; }
.tbar .t span { font: 13px var(--font-body); color: var(--ink-muted); margin-left: 6px; }
.tback { border: 0; background: none; padding: 0; color: var(--ink-muted); font: inherit; font-size: 13px; cursor: pointer; justify-self: start; }
.tsync { font-size: 12px; line-height: 16px; color: var(--ink-muted); display: flex; gap: 6px; align-items: center; }
.tsync i { width: 8px; height: 8px; border-radius: 50%; background: #138540; }
.tsync.busy i { background: var(--accent); }
.tsync.err { color: #d4433a; } .tsync.err i { background: #d4433a; }
.tbtn { border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; font-weight: 600; border-radius: var(--radius-sm); padding: 7px 14px; cursor: pointer; }
.tgrp { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tgrp > button { width: 100%; border: 0; background: var(--surface); padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; font: inherit; cursor: pointer; }
.tgrp .name { font-family: var(--font-display); font-size: 19px; line-height: 24px; }
.tgrp .cnt { font-size: 13px; color: var(--ink-muted); }
.tgrp .cnt b { color: var(--ink); font-weight: 600; }
.tgrp .inner { padding: 12px 14px 16px; display: grid; gap: 12px; }
.tsubs { display: flex; flex-wrap: wrap; gap: 6px; }
.tsub { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; display: inline-flex; gap: 6px; align-items: baseline; cursor: pointer; }
.tsub .n { color: var(--ink-muted); }
.tsub[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.tsub[aria-pressed="true"] .n { color: #e9e4e4; }
.tnum { box-sizing: border-box; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font: 600 11px/18px var(--font-body); font-variant-numeric: tabular-nums; text-align: center; display: inline-block; align-self: center; }
.tcard { position: relative; transition: opacity .15s; }
.tgrp.has .tcard:not(.on) { opacity: .45; }
.tgrp.has .tcard:not(.on):hover { opacity: .85; }
.tmark { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-strong); background: rgba(255,255,255,.92); display: grid; place-items: center; font-size: 16px; line-height: 1; z-index: 1; }
.tcard.on .tmark { background: var(--accent); border-color: var(--accent); color: #fff; }
.tdrawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: var(--bg); box-shadow: 0 12px 32px rgba(33,28,28,.16); z-index: 20; display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }
.tdrawer header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.tdrawer header b { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.tdrawer .body { overflow-y: auto; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; align-content: start; }
.tshade { position: fixed; inset: 0; background: rgba(33,28,28,.25); z-index: 19; }
.tclose { border: 0; background: none; color: var(--ink-muted); font: inherit; cursor: pointer; }
.tsec { font-weight: 600; font-size: 12.5px; line-height: 16px; margin: 8px 0 0; }
.tli { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 13px; line-height: 18px; padding: 2px 0; }
.tli .num { color: var(--ink-muted); }
.tli button { border: 0; background: none; color: var(--ink-muted); padding: 0 4px; font-size: 16px; line-height: 18px; cursor: pointer; }
.tremind { background: var(--pink); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; line-height: 18px; }
.tremind button { border: 0; background: none; padding: 0; color: var(--ink-muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; }
.thint { margin: 0; font-size: 12px; color: var(--ink-muted); }
.tpick { padding: 20px; display: grid; gap: 10px; min-width: min(420px, 90vw); }
.tpick h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0 0 4px; }
.tpick button.trow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg); font: inherit; text-align: left; cursor: pointer; }
.tpick button.trow:hover { background: var(--surface); }
.tpick .past { opacity: .6; }
@media (prefers-reduced-motion: reduce) { .tcard { transition: none; } }

[hidden] { display: none !important; }
.gate { max-width: 420px; margin: 0 auto; padding: 64px 16px; display: grid; gap: 16px; }
.gate-form { display: grid; gap: 10px; }
.gate-form p { margin: 0; }
.gate-form .search { width: 100%; }
.gate-err { color: #d4433a; font-size: 13px; }
.gate-btn { justify-self: start; padding: 8px 18px; border: 0; border-radius: var(--radius-sm); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<section class="gate" id="gate"></section>
<main class="page" hidden>
  <header class="head">
    <div>
      <h1 class="title">Мой гардероб</h1>
      <svg class="wave" viewBox="0 0 190 8" aria-hidden="true"><path d="M1 4 Q 6 0 11 4 T 21 4 T 31 4 T 41 4 T 51 4 T 61 4 T 71 4 T 81 4 T 91 4 T 101 4 T 111 4 T 121 4 T 131 4 T 141 4 T 151 4 T 161 4 T 171 4 T 181 4"/></svg>
    </div>
    <input class="search" id="q" type="search" placeholder="Поиск: «юбка розовая», «Sela», «лиоцелл», номер вещи…" aria-label="Поиск">
    <button class="tripopen" id="tripopen" type="button" hidden>🧳 В поездку</button>
  </header>
  <section class="trip" id="trip" hidden aria-label="Сбор в поездку"></section>
  <div id="tripdrawer"></div>
  <div class="layout">
    <aside class="side" aria-label="Фильтры">
      <div class="side-top"><span class="cap">Фильтры</span><button class="reset" id="reset" type="button">Сбросить все</button></div>
      <div class="fgroup"><h3>Категория</h3><div id="f-cat"></div></div>
      <div class="fgroup"><div class="fhead"><h3>Цвет</h3><button class="clr off" type="button" data-clr="colors" aria-label="Сбросить цвет" title="Сбросить цвет"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button></div><div class="chips" id="f-color"></div></div>
      <div class="fgroup"><div class="fhead"><h3>Бренд</h3><button class="clr off" type="button" data-clr="brands" aria-label="Сбросить бренды" title="Сбросить бренды"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button></div><details class="ms" id="f-brand"><summary><span id="f-brand-sum">Все бренды</span></summary><div class="ms-body">
        <input type="search" class="search" id="f-brand-q" placeholder="Найти бренд" aria-label="Найти бренд">
        <div class="ms-act"><button type="button" id="f-brand-all">Выбрать все</button><button type="button" id="f-brand-none">Снять</button></div>
        <div class="ms-list" id="f-brand-list"></div></div></details></div>
      <div class="fgroup"><div class="fhead"><h3>Где куплено</h3><button class="clr off" type="button" data-clr="shop" aria-label="Сбросить магазин" title="Сбросить магазин"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button></div><select id="f-shop" class="search" style="width:100%"></select></div>
      <div class="fgroup"><h3>Фото</h3><div class="seg" id="f-photo"></div></div>
      <div class="fgroup"><h3>Ссылка</h3><div class="seg" id="f-link"></div></div>
      <div class="fgroup"><h3>Актуальное</h3><div class="seg" id="f-core"></div></div>
      <div class="fgroup"><h3>Статус</h3><div class="seg" id="f-status"></div></div>
      <div class="fgroup"><h3>Любимое</h3><div class="seg" id="f-fav"></div></div>
    </aside>
    <section>
      <div class="bar"><button class="ftoggle" id="ftoggle" type="button" aria-expanded="false">Фильтры</button><span class="cap" id="count"></span>
        <select id="sort" class="search" style="width:auto" aria-label="Сортировка">
          <option value="no">По номеру</option>
          <option value="new">Сначала новые</option>
          <option value="name">По названию</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</main>
<dialog id="dlg"></dialog>
<script>window.__BUILD = '098db4fa';</script>
<script src="app.js?v=098db4fa"></script>
</body>
</html>
